spring.application.name=emergency-response
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emergency_response?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
